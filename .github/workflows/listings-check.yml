name: listings-check

# Recheck de anuncios inmobiliarios. Sin este reloj el seguimiento de precios
# NO corre solo: /api/listings/check existía pero nadie lo llamaba (el botón
# manual de la ficha era el único disparador). El endpoint recorre los listings
# vigilables con pausa de 1 s por anuncio y detecta bajadas, subidas y
# desapariciones (alertas + histórico).
#
# `CRON_SECRET` = secret del repo, DEBE coincidir con el env de Vercel.
#
# La CADENCIA por anuncio sigue siendo diaria; lo que cambió es la frecuencia
# del reloj. Antes corría una vez al día e intentaba barrerlo TODO en una
# petición, así que dejaba de caber en cuanto el corpus creciera (a ~3 s por
# anuncio, unos 100 como techo). Ahora cada pasada procesa un lote acotado y las
# demás vacían lo que no cupo.

on:
  # Desactivado el 2026-08-06: el recheck corre ahora en el VPS
  # (nidokey-runner.timer, cada 2 h) — ver docs/DEPLOY-RUNNER.md. Se conserva
  # solo el disparo manual por si hace falta una pasada a demanda.
  workflow_dispatch: {} # botón manual (pestaña Actions)

concurrency:
  group: listings-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Recheck de anuncios activos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 320 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://nidokey.es/api/listings/check"
